graphhopper:
  # Keep this path stable and switch the actual dataset via a symlink in ./data.
  # If you repoint region.osm.pbf to a different source PBF, clear /srv/graph-cache before restart.
  datareader.file: /srv/data/region.osm.pbf

  # Keep all GraphHopper runtime artifacts inside this tool directory.
  # This cache is tied to the imported PBF and must be rebuilt after dataset changes.
  graph.location: /srv/graph-cache

  # [CHANGES] Profiles limited to foot (pedestrian) only to reduce memory usage
  # and import time for smaller datasets
  profiles:
    - name: foot
      custom_model_files: [foot.json]

  # [CHANGES] Contraction Hierarchies (CH) disabled to reduce import time
  # and memory usage for foot-only routing
  profiles_ch: []

  # Leave LM disabled until you need more flexible weighting/runtime tradeoffs.
  profiles_lm: []

  # [CHANGES] Encoded values reduced to foot-only attributes to minimize memory footprint
  # by excluding car/bike data
  graph.encoded_values: |
    foot_access, foot_average_speed, foot_priority, foot_road_access, road_class, country, hike_rating, mtb_rating

  # [CHANGES] Elevation disabled to reduce memory usage and simplify setup,
  # as it's not critical for basic foot routing
  #graph.elevation.provider: srtm
  #graph.elevation.cache_dir: /srv/srtm
  #graph.elevation.interpolate: bilinear

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1

  routing.snap_preventions_default: tunnel, bridge, ferry
  routing.timeout_ms: 15000
  routing.max_visited_nodes: 1000000
  routing.non_ch.max_waypoint_distance: 1000000

  import.osm.ignored_highways: ''

  # [CHANGES] Ensure memory usage stays low by using MMAP for graph data access,
  # which allows larger datasets to be handled with limited RAM
  graph.dataaccess.default_type: MMAP

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  loggers:
    "com.graphhopper.osm_warnings":
      level: WARN
