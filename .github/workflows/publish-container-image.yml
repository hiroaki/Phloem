# Publish Phloem container images to GitHub Container Registry (GHCR).
#
# Automatic publishing:
# - Triggered when a Git tag matching "v*" is pushed.
# - Publishes both:
# ghcr.io/<owner>/<repository>:<tag>
# ghcr.io/<owner>/<repository>:latest
#
# Example:
# git tag v1.0.0
# git push origin v1.0.0
#
# Manual publishing:
# - Open GitHub Actions.
# - Select this workflow.
# - Click "Run workflow".
# - Specify an image tag (for example: test, beta, rc1).
#
# Notes:
# - Image names are automatically converted to lowercase to satisfy
# GitHub Container Registry naming requirements.
# - Images are published to the registry associated with the current
# repository, making the workflow fork-friendly.

name: Publish Container Image

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag"
        required: true
env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-container-image-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.event.inputs.image_tag) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Validate manual image tag
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ "${IMAGE_TAG,,}" == "latest" ]]; then
            echo "Invalid image_tag: '$IMAGE_TAG'"
            echo "The 'latest' tag is reserved for release tags and cannot be used in manual runs."
            exit 1
          fi

          if ! [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image_tag: '$IMAGE_TAG'"
            echo "Use 1-128 chars: letters, numbers, underscores, periods, and hyphens."
            exit 1
          fi

      - name: Extract metadata (tag release)
        if: github.event_name == 'push'
        id: meta_release
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push (tag release)
        if: github.event_name == 'push'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}

      - name: Build and push (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}:${{ github.event.inputs.image_tag }}
